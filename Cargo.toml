[workspace]
resolver = "2"
members = [
    "crates/clawrs-core",
    "crates/clawrs-events",
    "crates/clawrs-memory",
    "crates/clawrs-llm",
    "crates/clawrs-tools",
    "crates/clawrs-agent",
    "crates/clawrs-gateway",
    "crates/clawrs-config",
    "crates/clawrs-store",
    "crates/clawrs-cli",
]
default-members = ["crates/clawrs-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/clawrs/clawrs"
authors = ["ClawRS Contributors"]
keywords = ["ai", "agents", "llm", "rust"]
categories = ["development-tools", "web-programming"]
description = "Rust-native AI agent platform"

[workspace.dependencies]
clawrs-core = { path = "crates/clawrs-core" }
clawrs-events = { path = "crates/clawrs-events" }
clawrs-memory = { path = "crates/clawrs-memory" }
clawrs-llm = { path = "crates/clawrs-llm" }
clawrs-tools = { path = "crates/clawrs-tools" }
clawrs-agent = { path = "crates/clawrs-agent" }
clawrs-gateway = { path = "crates/clawrs-gateway" }
clawrs-config = { path = "crates/clawrs-config" }
clawrs-store = { path = "crates/clawrs-store" }

tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.11", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
parking_lot = "0.12"
bytes = "1.9"
pin-project-lite = "0.2"
metrics = "0.24"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "chrono", "uuid", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
